# 智序者配置文件（版本号见 engine/__init__.py __version__）
# 所有路径相对于项目根目录

# ── 模型 ──
model:
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  temperature: 0.4
  max_tokens: 16384  # V4-Flash 最大输出 384K，保持 16K 避免冗长回复
  request_timeout: 60
  max_retries: 3

# ── Agent ──
agent:
  max_tool_rounds: 15         # 普通对话 ReAct 循环最大工具调用轮次（从10提升，覆盖复杂查询）
  max_tool_output_chars: 32000 # 单次工具输出截断长度
  confirm_tools: [run_shell, batch_files]   # 需要 HITL 确认的工具（batch_files 是批量破坏性操作，必须人审）
  auto_task: true             # 普通对话中让 Brain 判断是否自动升级为任务模式（多一步轻量 API 调用）
  context:                    # 上下文压缩：长对话自动摘要，控制输入 token 成本
    enabled: true             # 是否启用
    keep_recent: 20           # 保留最近完整消息条数（对话连续性）
    summarize_chunk: 10       # 累计新增多少条旧消息触发一次摘要（防抖）
    max_summary_chars: 1500   # 摘要文本上限（超出截断）

# ── 任务模式 ──
task:
  max_steps: 8                # 最多执行步骤数
  plan_retries: 3             # 规划解析重试次数
  max_tool_rounds: 25         # 任务模式下每一步的工具调用轮次上限（从15→25，解决学习任务源码阅读轮次耗尽问题）

# ── 记忆 ──
memory:
  min_score: 0.25             # 记忆检索最低相关度阈值
  max_entries: 3              # 每次注入的最大记忆条数
  entry_max_chars: 300        # 单条记忆截断长度
  dedup_threshold: 0.7        # Jaccard 去重阈值

# ── 日志 ──
logging:
  level: INFO                  # DEBUG | INFO | WARNING | ERROR
  dir: logs                    # 日志目录（相对于项目根）
  file_max_bytes: 10485760     # 单文件最大字节（10MB）
  file_backup_count: 5         # 保留历史文件数
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# ── 工具 ──
tools:
  shell:
    default_timeout: 30
    max_timeout: 120
    max_retries: 2
  file:
    max_file_size: 1048576     # read_file 最大文件大小（1MB）
    allowed_dirs: []            # write_file 允许的目录（空=仅项目内）

# ── 知识学习 ──
learning:
  repo_dir: memory/knowledge/repos         # clone 仓库存放目录
  knowledge_dir: memory/knowledge/languages # 提炼知识存放目录
  max_repo_size_mb: 200                    # repos/ 总大小上限
  max_repo_depth: 1                        # git clone --depth
  max_source_files: 5                      # 最多读几个源码文件
