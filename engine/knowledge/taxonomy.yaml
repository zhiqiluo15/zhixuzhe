        difficulty: advanced

      - id: packaging-python
        name: 包管理
        parent: Python
        search: "python pip poetry uv packaging best practices"
        difficulty: beginner

      - id: testing-python
        name: 测试
        parent: Python
        search: "python pytest testing best practices mock fixtures patterns"
        difficulty: beginner

