# 智序者知识分类树
# 每个叶子节点代表一个可学习的计算机知识主题。
# 新增主题只需在此文件添加一条记录，前端面板自动出现对应卡片。
#
# 字段说明：
#   id          — 唯一标识（用于 API 路由和数据关联）
#   name        — 显示名称
#   parent      — 所属语言/领域（用于能力档案的评级关联）
#   search      — GitHub 搜索提示词（自动拼接 site:github.com + best practices 质量信号）
#   repo_hint   — 可选：直接推荐的权威仓库
#   difficulty  — 难度：beginner / intermediate / advanced

categories:
  - id: programming-languages
    name: 编程语言
    icon: code
    children:
      - id: async-python
        name: 异步编程
        parent: Python
        search: "python asyncio best practices production patterns"
        repo_hint: "python/cpython/tree/main/Lib/asyncio"
        difficulty: intermediate

      - id: typing-python
        name: 类型系统
        parent: Python
        search: "python typing best practices mypy pydantic type hints"
        difficulty: intermediate

      - id: concurrency-python
        name: 并发模型
        parent: Python
        search: "python concurrency threading multiprocessing GIL best practices"
        difficulty: advanced

      - id: web-frameworks-python
        name: Web 框架
        parent: Python
