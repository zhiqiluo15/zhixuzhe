<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智序者 zhixuzhe v1</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #03030d;
  color: #d0d0d0;
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}

/* ── 星空画布 ── */
#stars {
  position: fixed; top:0; left:0; width:100%; height:100%;
  z-index: 0; pointer-events: none;
}

/* ── 头部 ── */
header {
  position: relative; z-index: 1;
  background: linear-gradient(180deg, rgba(4,4,18,0.97) 50%, rgba(4,4,18,0));
  padding: 16px 22px 10px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
header h1 {
  font-size: 20px; font-weight: 600;
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
header .badge {
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  background: rgba(167,139,250,0.12); color: #8b83ba; letter-spacing: 0.5px;
}
header .subtitle { font-size: 11px; color: #555; margin-left: 4px; }
header .actions { margin-left: auto; display: flex; gap: 8px; }
header .actions button {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  color: #999; padding: 6px 14px; border-radius: 7px; cursor: pointer;
  font-size: 12px; transition: all 0.2s;
}
header .actions button:hover { background: rgba(167,139,250,0.15); color: #ccc; border-color: rgba(167,139,250,0.3); }
header .actions button.active { background: rgba(167,139,250,0.18); border-color: #8b5cf6; color: #c4b5fd; }

/* ── 聊天区域 ── */
#chat {
  position: relative; z-index: 1;
  flex: 1; overflow-y: auto; padding: 12px 20px 110px;
  display: flex; flex-direction: column; gap: 14px;
}
#chat::-webkit-scrollbar { width: 3px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.15); border-radius: 2px; }

/* ── 消息气泡 ── */
.msg {
  display: flex; gap: 10px; max-width: 82%;
  animation: fadeIn 0.35s ease;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }
.msg.system { align-self: center; max-width: 92%; }
.msg.system .bubble {
  background: rgba(167,139,250,0.06); border: 1px solid rgba(167,139,250,0.1);
  color: #8b83ba; font-size: 12px; border-radius: 8px;
}

/* ── 工具调用消息 ── */
.msg.tool {
  align-self: flex-start; max-width: 88%;
}
.msg.tool .tool-msg {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 12px; border-radius: 10px;
  font-size: 12px; line-height: 1.5;
  animation: fadeIn 0.3s ease;
}
.msg.tool .tool-msg.tool-start {
  background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.15);
  color: #d4a853;
}
.msg.tool .tool-msg.tool-end {
  background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.12);
  color: #6bbf9a;
}
.msg.tool .tool-msg.tool-cancelled {
  background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15);
  color: #d47272;
}
.msg.tool .tool-icon {
  font-size: 14px; flex-shrink: 0; margin-top: 1px;
}
.msg.tool .tool-body { flex: 1; min-width: 0; }
.msg.tool .tool-name {
  font-weight: 600; font-family: "Consolas", "Cascadia Code", monospace;
  color: #c4b5fd;
}
.msg.tool .tool-args {
  color: #888; font-size: 11px; word-break: break-all;
  margin-top: 2px;
}
.msg.tool .tool-result {
  color: #aaa; font-size: 11px; margin-top: 3px;
  white-space: pre-wrap; word-break: break-word;
  max-height: 60px; overflow: hidden;
}
.msg.tool .tool-truncated-tag {
  display: inline-block; font-size: 10px; padding: 1px 6px;
  border-radius: 6px; background: rgba(251,191,36,0.12); color: #d4a853;
  margin-left: 6px;
}

/* ── 思考动画 ── */
.thinking-dots {
  display: inline-flex; gap: 3px; align-items: center;
}
.thinking-dots span {
  width: 4px; height: 4px; border-radius: 50%;
  background: #a78bfa;
  animation: dotPulse 1.2s infinite ease-in-out;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.7); }
  40% { opacity: 1; transform: scale(1); }
}

/* ── 截断警告 ── */
.truncation-warning {
  display: inline-block; padding: 4px 10px; border-radius: 6px;
  background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2);
  color: #d4a853; font-size: 11px; margin-top: 6px;
}

/* ── SVG 头像 ── */
.avatar {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; position: relative; overflow: hidden;
}
.avatar.user-av {
  background: linear-gradient(145deg, #1e3a8a, #1d4ed8);
  box-shadow: 0 2px 8px rgba(59,130,246,0.15);
}
.avatar.assistant-av {
  background: linear-gradient(145deg, #4c1d95, #7c3aed);
  box-shadow: 0 2px 8px rgba(139,92,246,0.15);
}
.avatar svg {
  width: 18px; height: 18px; fill: rgba(255,255,255,0.85);
}

.bubble {
  padding: 11px 16px; border-radius: 14px;
  font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
}
.bubble.user-bub {
  background: linear-gradient(145deg, #1d4ed8, #1e40af);
  color: #fff; border-bottom-right-radius: 5px;
  box-shadow: 0 2px 8px rgba(29,78,216,0.15);
}
.bubble.assistant-bub {
  background: rgba(22,22,38,0.92);
  border: 1px solid rgba(167,139,250,0.08);
  border-bottom-left-radius: 5px;
}

/* ── Markdown 渲染样式 ── */
.rendered-md table {
  border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%;
}
.rendered-md th, .rendered-md td {
  border: 1px solid rgba(167,139,250,0.15); padding: 6px 10px; text-align: left;
}
.rendered-md th {
  background: rgba(167,139,250,0.08); color: #c4b5fd; font-weight: 600;
}
.rendered-md td { color: #ccc; }
.rendered-md strong { color: #e2e2e2; font-weight: 600; }
.rendered-md em { color: #c4b5fd; }
.rendered-md code {
  background: rgba(167,139,250,0.1); color: #c4b5fd;
  padding: 2px 6px; border-radius: 4px; font-size: 12px;
  font-family: "Consolas", "Cascadia Code", monospace;
}
.rendered-md pre {
  background: rgba(10,10,24,0.9); border: 1px solid rgba(167,139,250,0.12);
  border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 8px 0;
}
.rendered-md pre code {
  background: none; padding: 0; color: #d0d0d0; font-size: 12px;
}
.rendered-md h3 { font-size: 15px; color: #c4b5fd; margin: 10px 0 6px; font-weight: 600; }
.rendered-md h4 { font-size: 14px; color: #b8acf6; margin: 8px 0 4px; font-weight: 600; }
.rendered-md ul, .rendered-md ol { margin: 4px 0; padding-left: 20px; }
.rendered-md li { margin: 2px 0; }
.rendered-md a { color: #a78bfa; }
.rendered-md hr { border: none; border-top: 1px solid rgba(167,139,250,0.1); margin: 10px 0; }
.rendered-md blockquote {
  border-left: 3px solid rgba(167,139,250,0.3); padding-left: 12px;
  color: #999; margin: 6px 0;
}

/* 打字光标 */
.bubble.streaming::after {
  content: "▌"; animation: blink 0.8s infinite;
  color: #a78bfa;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

/* ── 输入区 ── */
footer {
  position: relative; z-index: 1;
  padding: 0 20px 18px; flex-shrink: 0;
}
.input-box {
  display: flex; gap: 10px; align-items: flex-end;
  background: rgba(16,16,32,0.92); border: 1px solid rgba(167,139,250,0.08);
  border-radius: 14px; padding: 9px 14px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}
.input-box textarea {
  flex: 1; background: transparent; border: none; outline: none;
  color: #d0d0d0; font-size: 14px; font-family: inherit;
  resize: none; max-height: 120px; line-height: 1.55;
  padding: 4px 0;
}
.input-box textarea::placeholder { color: rgba(255,255,255,0.15); }
.input-box button {
  background: linear-gradient(135deg, #6d28d9, #7c3aed);
  border: none; color: #fff; padding: 9px 22px; border-radius: 10px;
  cursor: pointer; font-size: 13px; font-weight: 500;
  transition: all 0.2s; flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(124,58,237,0.25);
}
.input-box button:hover { opacity: 0.92; transform: scale(1.03); box-shadow: 0 4px 14px rgba(124,58,237,0.35); }
.input-box button:disabled { opacity: 0.3; transform: none; box-shadow: none; cursor: default; }
footer .hint {
  text-align: center; font-size: 10px; color: rgba(255,255,255,0.1);
  margin-top: 7px; letter-spacing: 0.3px;
}

/* ── API Key 设置覆盖层 ── */
#setup-overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  z-index: 100;
  background: rgba(2,2,10,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;
}
#setup-overlay.hidden { display: none; }
#setup-overlay .setup-icon {
  width: 64px; height: 64px; border-radius: 16px;
  background: linear-gradient(145deg, #4c1d95, #7c3aed);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(124,58,237,0.3);
}
#setup-overlay .setup-icon svg { width: 32px; height: 32px; fill: #fff; }
#setup-overlay h2 {
  font-size: 22px; font-weight: 600; color: #e0e0e0;
}
#setup-overlay .setup-desc {
  font-size: 13px; color: #777; text-align: center; line-height: 1.7; max-width: 400px;
}
#setup-overlay .setup-desc a { color: #a78bfa; text-decoration: none; }
#setup-overlay .setup-desc a:hover { text-decoration: underline; }
#setup-overlay .setup-input {
  display: flex; gap: 10px; width: 100%; max-width: 460px;
}
#setup-overlay .setup-input input {
  flex: 1; background: rgba(20,20,40,0.9); border: 1px solid rgba(167,139,250,0.2);
  color: #e0e0e0; padding: 11px 16px; border-radius: 10px;
  font-size: 14px; font-family: "Consolas", "Cascadia Code", monospace;
  outline: none; transition: border-color 0.2s;
}
#setup-overlay .setup-input input:focus { border-color: #7c3aed; }
#setup-overlay .setup-input input::placeholder { color: rgba(255,255,255,0.15); }
#setup-overlay .setup-input button {
  background: linear-gradient(135deg, #6d28d9, #7c3aed);
  border: none; color: #fff; padding: 11px 24px; border-radius: 10px;
  cursor: pointer; font-size: 14px; font-weight: 500;
  transition: all 0.2s; white-space: nowrap;
  box-shadow: 0 2px 12px rgba(124,58,237,0.3);
}
#setup-overlay .setup-input button:hover { opacity: 0.92; transform: scale(1.02); }
#setup-overlay .setup-error {
  font-size: 12px; color: #f87171; display: none;
}
#setup-overlay .setup-status {
  font-size: 12px; color: #555; min-height: 18px;
}

/* ── HITL 确认覆盖层 ── */
#confirm-overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  z-index: 90;
  background: rgba(2,2,10,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
}
#confirm-overlay.visible { display: flex; }
#confirm-overlay .confirm-card {
  background: rgba(22,22,38,0.98);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 14px; padding: 24px 28px;
  max-width: 420px; width: 90%;
  text-align: center;
}
#confirm-overlay .confirm-title {
  font-size: 16px; color: #f87171; font-weight: 600; margin-bottom: 10px;
}
#confirm-overlay .confirm-tool {
  font-size: 13px; color: #a78bfa; font-family: "Consolas", monospace;
  word-break: break-all; margin-bottom: 6px;
  background: rgba(167,139,250,0.06); padding: 8px 12px; border-radius: 8px;
}
#confirm-overlay .confirm-args {
  font-size: 11px; color: #777; word-break: break-all;
  margin-bottom: 18px;
}
#confirm-overlay .confirm-buttons {
  display: flex; gap: 12px; justify-content: center;
}
#confirm-overlay .confirm-buttons button {
  padding: 10px 28px; border-radius: 10px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: all 0.2s;
  border: none;
}
#confirm-overlay .btn-deny {
  background: rgba(255,255,255,0.06); color: #999;
  border: 1px solid rgba(255,255,255,0.1);
}
#confirm-overlay .btn-deny:hover { background: rgba(255,255,255,0.12); color: #ccc; }
#confirm-overlay .btn-approve {
  background: linear-gradient(135deg, #dc2626, #ef4444);
  color: #fff; box-shadow: 0 2px 10px rgba(239,68,68,0.3);
}
#confirm-overlay .btn-approve:hover { opacity: 0.92; transform: scale(1.03); }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<!-- API Key 设置覆盖层 -->
<div id="setup-overlay">
  <div class="setup-icon">
    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
  </div>
  <h2>设置 DeepSeek API Key</h2>
  <div class="setup-desc">
    智序者需要 DeepSeek API Key 才能运行。<br>
    前往 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">platform.deepseek.com</a> 获取。<br>
    Key 会安全保存在项目 .env 文件中，不会上传。
  </div>
  <div class="setup-input">
    <input type="password" id="api-key-input" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx"
      onkeydown="if(event.key==='Enter')submitSetup()">
    <button onclick="submitSetup()">确认</button>
  </div>
  <div class="setup-error" id="setup-error"></div>
  <div class="setup-status" id="setup-status"></div>
</div>

<!-- HITL 确认覆盖层 -->
<div id="confirm-overlay">
  <div class="confirm-card">
    <div class="confirm-title">⚠️ 工具调用确认</div>
    <div class="confirm-tool" id="confirm-tool-name"></div>
    <div class="confirm-args" id="confirm-tool-args"></div>
    <div class="confirm-buttons">
      <button class="btn-deny" onclick="respondConfirm(false)">拒绝</button>
      <button class="btn-approve" onclick="respondConfirm(true)">允许执行</button>
    </div>
  </div>
</div>

<header>
  <h1>智序者 zhixuzhe</h1>
  <span class="badge">v1</span>
  <span class="subtitle">DeepSeek · 流式</span>
  <div class="actions">
    <button id="taskBtn" onclick="toggleTaskMode()" title="切换任务模式">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      任务
    </button>
    <button onclick="resetChat()" title="重置对话">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      重置
    </button>
  </div>
</header>

<div id="chat">
  <div class="msg assistant">
    <div class="avatar assistant-av">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    </div>
    <div class="bubble assistant-bub" id="greeting-bubble">你好，我是智序者。有什么可以帮你？</div>
  </div>
</div>

<footer>
  <div class="input-box">
    <textarea id="input" rows="1" placeholder="输入消息..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
  <div class="hint" id="hint">Enter 发送，Shift+Enter 换行</div>
</footer>

<script>
// ══════════════════════════════════════════
//  API Key 设置流程
// ══════════════════════════════════════════
const setupOverlay = document.getElementById('setup-overlay');
const apiKeyInput = document.getElementById('api-key-input');
const setupError = document.getElementById('setup-error');
const setupStatus = document.getElementById('setup-status');

async function checkStatus() {
  try {
    const resp = await fetch('/status');
    const data = await resp.json();
    if (data.ready) {
      setupOverlay.classList.add('hidden');
    } else {
      setupOverlay.classList.remove('hidden');
      setupStatus.textContent = '请设置 API Key 以继续';
    }
  } catch (e) {
    setupOverlay.classList.remove('hidden');
    setupStatus.textContent = '无法连接到服务，请确认服务器正在运行';
  }
}

async function submitSetup() {
  const key = apiKeyInput.value.trim();
  if (!key) {
    setupError.style.display = 'block';
    setupError.textContent = '请输入 API Key';
    return;
  }
  if (!key.startsWith('sk-')) {
    setupError.style.display = 'block';
    setupError.textContent = 'API Key 格式不正确，应以 sk- 开头';
    return;
  }

  setupError.style.display = 'none';
  setupStatus.textContent = '正在验证...';

  try {
    const resp = await fetch('/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
    });
    const data = await resp.json();

    if (resp.ok) {
      setupStatus.textContent = `设置成功！（${data.tools} 工具，${data.skills} 技能）`;
      setTimeout(() => {
        setupOverlay.classList.add('hidden');
        inputEl.focus();
      }, 1000);
    } else {
      setupError.style.display = 'block';
      setupError.textContent = '设置失败: ' + (data.error || '未知错误');
      setupStatus.textContent = '';
    }
  } catch (e) {
    setupError.style.display = 'block';
    setupError.textContent = '网络错误: ' + e.message;
    setupStatus.textContent = '';
  }
}

// 页面加载时检查状态
checkStatus();

// ── HITL 确认 ──
let currentConfirmId = null;

function showConfirmDialog(id, toolName, args) {
  currentConfirmId = id;
  document.getElementById('confirm-tool-name').textContent = toolName;
  document.getElementById('confirm-tool-args').textContent = JSON.stringify(args, null, 2);
  document.getElementById('confirm-overlay').classList.add('visible');
}

function respondConfirm(approved) {
  document.getElementById('confirm-overlay').classList.remove('visible');
  if (currentConfirmId) {
    fetch('/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentConfirmId, approved: approved }),
    }).catch(() => {});
    currentConfirmId = null;
  }
}

// 渲染初始问候语
(function initGreeting() {
  const gb = document.getElementById('greeting-bubble');
  if (gb && typeof marked !== 'undefined') {
    gb.innerHTML = `<div class="rendered-md">${renderMarkdown(gb.textContent)}</div>`;
  } else if (gb) {
    // marked.js 尚未加载，监听加载后渲染
    document.querySelector('script[src*="marked"]').addEventListener('load', () => {
      gb.innerHTML = `<div class="rendered-md">${renderMarkdown(gb.textContent)}</div>`;
    });
  }
})();

// ══════════════════════════════════════════
//  星空背景（暗色调 + 低亮度）
// ══════════════════════════════════════════
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
let w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initStars(); });

function initStars() {
  stars = [];
  const count = Math.floor(w * h / 3500);
  for (let i = 0; i < count; i++) {
    const layer = Math.random();
    stars.push({
      x: Math.random() * w, y: Math.random() * h,
      r: 0.2 + layer * 1.4,
      layer: layer,
      brightness: 0.12 + Math.random() * 0.45,
      twinkleSpeed: 0.003 + Math.random() * 0.02,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
}
initStars();

function drawStars(time) {
  ctx.clearRect(0, 0, w, h);

  // 深层夜空渐变
  const g = ctx.createRadialGradient(w/2, h/4, 0, w/2, h, w*0.8);
  g.addColorStop(0, 'rgba(8,6,24,0.2)');
  g.addColorStop(0.5, 'rgba(4,3,14,0.25)');
  g.addColorStop(1, 'rgba(2,2,10,0.3)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  for (const s of stars) {
    let alpha = s.brightness + Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.18;
    alpha = Math.max(0.04, alpha);

    const baseR = 140 + Math.floor(s.layer * 80);
    const baseG = 160 + Math.floor(s.layer * 60);
    const baseB = 210 + Math.floor(s.layer * 40);
    ctx.fillStyle = `rgba(${baseR},${baseG},${baseB},${alpha * (0.18 + s.layer * 0.28)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    // 稀疏微辉光
    if (s.r > 1.0 && alpha > 0.5) {
      ctx.fillStyle = `rgba(150,170,220,${alpha * 0.06})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function animate(time) {
  drawStars(time);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ══════════════════════════════════════════
//  聊天逻辑
// ══════════════════════════════════════════
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const taskBtn = document.getElementById('taskBtn');
let isTaskMode = false;
let isStreaming = false;

function scrollBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── Markdown 渲染 + XSS 防护 ──

function renderMarkdown(text) {
  if (typeof marked === 'undefined') return text;
  return marked.parse(text, { breaks: true, gfm: true });
}

// 转义纯文本为 HTML 安全字符串（用于 user 消息、流式初始内容）
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 白名单清理 HTML：移除危险元素和事件属性，防 markdown 渲染后的内联 HTML 注入
function sanitizeHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form').forEach(el => el.remove());
  tmp.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();
      const val = (attr.value || '').toLowerCase().trim();
      if (name.startsWith('on')) {
        el.removeAttribute(attr.name);
      } else if ((name === 'href' || name === 'src' || name === 'xlink:href') &&
                 (val.startsWith('javascript:') || val.startsWith('data:text/html'))) {
        el.removeAttribute(attr.name);
      }
    });
  });
  return tmp.innerHTML;
}

// 安全渲染：markdown → sanitize
function renderMarkdownSafe(text) {
  return sanitizeHtml(renderMarkdown(text));
}

function finalizeBubble(bubble) {
  if (!bubble || !bubble.textContent) return;
  const raw = bubble.textContent;
  bubble.setAttribute('data-raw', raw);
  bubble.innerHTML = `<div class="rendered-md">${renderMarkdownSafe(raw)}</div>`;
}

// 头像 SVG 内联
const USER_AVATAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v1.2c0 .66.54 1.2 1.2 1.2h16.8c.66 0 1.2-.54 1.2-1.2v-1.2c0-3.2-6.4-4.8-9.6-4.8z"/></svg>';
const AI_AVATAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z" fill="rgba(255,255,255,0.15)"/></svg>';

function addMessage(role, content, streaming=false) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  if (role === 'system') {
    // system 消息渲染 markdown（支持 **加粗** 等），经 sanitize 防 XSS
    div.innerHTML = `<div class="bubble">${renderMarkdownSafe(content)}</div>`;
  } else {
    const avatarClass = role === 'user' ? 'user-av' : 'assistant-av';
    const bubbleClass = role === 'user' ? 'user-bub' : 'assistant-bub';
    const avatarSvg = role === 'user' ? USER_AVATAR_SVG : AI_AVATAR_SVG;
    const isAssistant = role === 'assistant';
    // user 消息纯文本转义；assistant 非流式渲染 markdown；流式用转义文本（后续 textContent 累积）
    let rendered;
    if (isAssistant && !streaming) {
      rendered = `<div class="rendered-md">${renderMarkdownSafe(content)}</div>`;
    } else {
      rendered = escapeHtml(content);
    }
    div.innerHTML = `
      <div class="avatar ${avatarClass}">${avatarSvg}</div>
      <div class="bubble ${bubbleClass} ${streaming ? 'streaming' : ''}">${rendered}</div>
    `;
  }
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}

// 添加工具调用消息（chat 模式下可见的工具调用进度）
function addToolMessage(eventType, data) {
  const div = document.createElement('div');
  div.className = 'msg tool';
  div.setAttribute('data-tool-name', data.tool_name);

  const roundLabel = data.round ? `[轮${data.round}] ` : '';

  if (eventType === 'tool_start') {
    const argsStr = JSON.stringify(data.args);
    div.innerHTML = `
      <div class="tool-msg tool-start">
        <span class="tool-icon">🔧</span>
        <div class="tool-body">
          <span class="tool-name">${escapeHtml(roundLabel + data.tool_name)}</span>
          <div class="tool-args">${escapeHtml(argsStr.length > 120 ? argsStr.slice(0, 120) + '...' : argsStr)}</div>
        </div>
      </div>`;
  } else if (eventType === 'tool_end') {
    const statusClass = data.cancelled ? 'tool-cancelled' : 'tool-end';
    const icon = data.cancelled ? '❌' : '✅';
    let resultHtml = '';
    if (data.result_preview) {
      resultHtml = `<div class="tool-result">${escapeHtml(data.result_preview)}</div>`;
    }
    const truncatedTag = data.truncated ? '<span class="tool-truncated-tag">已截断</span>' : '';
    div.innerHTML = `
      <div class="tool-msg ${statusClass}">
        <span class="tool-icon">${icon}</span>
        <div class="tool-body">
          <span class="tool-name">${escapeHtml(roundLabel + data.tool_name)}${truncatedTag}</span>
          ${resultHtml}
        </div>
      </div>`;
  }
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}

// 思考指示器 —— 用 system 消息显示动画点
let thinkingEl = null;
function showThinking() {
  if (thinkingEl) return;
  thinkingEl = document.createElement('div');
  thinkingEl.className = 'msg system';
  thinkingEl.innerHTML = '<div class="bubble" style="display:flex;align-items:center;gap:8px;font-size:12px;color:#8b83ba;">AI 思考中<span class="thinking-dots"><span></span><span></span><span></span></span></div>';
  chatEl.appendChild(thinkingEl);
  scrollBottom();
}
function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}

function setHint(text) {
  document.getElementById('hint').textContent = text;
}

function toggleTaskMode() {
  isTaskMode = !isTaskMode;
  taskBtn.classList.toggle('active', isTaskMode);
  inputEl.placeholder = isTaskMode ? '输入任务目标...' : '输入消息...';
  setHint(isTaskMode ? '任务模式：智序者将自主规划并执行' : 'Enter 发送，Shift+Enter 换行');
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || isStreaming) return;

  inputEl.value = '';
  isStreaming = true;
  sendBtn.disabled = true;

  addMessage('user', text);
  setHint('思考中...');
  showThinking();

  const endpoint = isTaskMode ? '/task' : '/chat';
  const bodyKey = isTaskMode ? 'goal' : 'message';

  try {
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [bodyKey]: text }),
    });

    if (!resp.ok) {
      hideThinking();
      addMessage('system', `请求失败: HTTP ${resp.status}`);
      isStreaming = false; sendBtn.disabled = false; setHint('');
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let bubble = null;
    let hasToolCalls = false;  // 跟踪本轮是否有工具调用

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n\n');
      buffer = lines.pop() || '';

      for (const block of lines) {
        if (!block.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(block.slice(6));

          if (data.type === 'text') {
            hideThinking();
            if (!bubble) {
              const div = addMessage('assistant', data.content, true);
              bubble = div.querySelector('.bubble');
            } else {
              bubble.textContent += data.content;
            }
            scrollBottom();

          } else if (data.type === 'tool_start') {
            // 工具调用开始 —— 展示进度，打破黑箱
            hasToolCalls = true;
            hideThinking();
            addToolMessage('tool_start', data);

          } else if (data.type === 'tool_end') {
            // 工具调用完成 —— 更新结果
            addToolMessage('tool_end', data);
            // 工具完成后可能还要等 Brain 思考，显示思考指示器
            showThinking();

          } else if (data.type === 'done') {
            hideThinking();
            if (bubble) {
              bubble.classList.remove('streaming');
              finalizeBubble(bubble);
            }
            setHint('');
            // 检查是否可能被截断（max_tokens 耗尽或轮次耗尽）
            if (data.content && data.content.includes('[已达到最大工具调用轮次')) {
              addMessage('system', '⚠️ 已达到工具调用上限，回复可能不完整');
            }

          } else if (data.type === 'task_start') {
            hideThinking();
            addMessage('system', `**目标：** ${data.goal}`);

          } else if (data.type === 'task_step') {
            addMessage('system', data.content);

          } else if (data.type === 'task_done') {
            hideThinking();
            addMessage('assistant', data.content);
            setHint('');

          } else if (data.type === 'error') {
            hideThinking();
            addMessage('system', `错误: ${data.content}`);
            setHint('');

          } else if (data.type === 'confirm_request') {
            showConfirmDialog(data.id, data.tool_name, data.args);
          }
        } catch (e) {
          // 不再静默丢弃 —— 输出到控制台方便排查
          console.error('[SSE] 解析失败:', e, '原始数据:', block.slice(0, 200));
        }
      }
    }

    hideThinking();
    if (bubble) bubble.classList.remove('streaming');

  } catch (e) {
    hideThinking();
    addMessage('system', `连接错误: ${e.message}`);
    setHint('');
  }

  isStreaming = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

async function resetChat() {
  if (isStreaming) return;
  try {
    await fetch('/reset', { method: 'POST' });
    chatEl.innerHTML = '';
    addMessage('assistant', '对话已重置。有什么可以帮你？');
  } catch (e) {
    addMessage('system', '重置失败');
  }
}
</script>
