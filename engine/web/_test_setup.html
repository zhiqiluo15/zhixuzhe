<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>setup 测试</title></head>
<html>
<head><meta charset="utf-8"><title>setup 测试</title></head>
<body>
<div id="result">等待...</div>
<script>
// 模拟用户点击提交：同源 fetch('/setup')，携带 JSON body
async function run() {
  const out = document.getElementById('result');
  try {
    const resp = await fetch('/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: 'sk-edge-headless-test' }),
    });
    let text = '';
    try { text = await resp.text(); } catch (e) { text = 'body 解析失败: ' + e.message; }
    out.textContent = 'HTTP ' + resp.status + ' | ACAO=' + (resp.headers.get('access-control-allow-origin') || '(无)') + ' | body=' + text;
  } catch (e) {
    out.textContent = 'FETCH异常: ' + e.message;
  }
}
run();
</script>
</body>
</html>
